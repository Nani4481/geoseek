# Recommended install path on Windows (conda available) — used for this project.
# Binary-heavy geospatial/ML packages come from conda-forge / pytorch / nvidia channels,
# which build against system CUDA/GDAL correctly on Windows.
#
#   conda env create -f environment.yml
#   conda activate geoseek
#   pip install -e . --no-deps
#   pip install --no-deps open_clip_torch timm ftfy huggingface_hub requests tqdm \
#       hdbscan fastapi "uvicorn[standard]" pydantic sqlalchemy pytest affine pillow
#
# IMPORTANT: torch and torchvision MUST stay conda-installed (CUDA build). Both are
# listed here explicitly so conda pins them; when pip-installing the remaining pure
# python deps above, always pass --no-deps — otherwise pip resolves its own (CPU-only
# on Windows) torch/torchvision wheels and silently uninstalls the CUDA build. If that
# ever happens: `pip uninstall -y torch torchvision` then rerun the `conda install`
# line below to restore it.
#
#   conda install -n geoseek -c pytorch -c nvidia -c conda-forge pytorch=2.2.2 pytorch-cuda=12.1 torchvision
#
name: geoseek
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.2
  - pytorch-cuda=12.1
  - torchvision
  - faiss-cpu>=1.8
  - rasterio>=1.3
  - gdal
  - pyproj>=3.6
  - shapely>=2.0
  - numpy>=1.26,<2.0
  - scikit-learn>=1.4
  - opencv
