<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSeek</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens/candidate.css">
<link rel="stylesheet" href="css/screens/queue.css">
<link rel="stylesheet" href="css/screens/overview.css">
<link rel="stylesheet" href="css/screens/search.css">
<link rel="stylesheet" href="css/screens/detect.css">
<link rel="stylesheet" href="css/screens/discovery.css">
<link rel="stylesheet" href="css/screens/watch.css">
</head>
<body>
<div id="root">
  <div id="topbar">
    <div class="tb-section tb-wordmark" id="tb-wordmark"></div>
    <div class="tb-section tb-aoi" id="tb-aoi"></div>
    <div class="tb-section tb-window" id="tb-window"></div>
    <div class="tb-spacer"></div>
    <div class="tb-section tb-offline" id="tb-offline">
      <span class="tb-offline-dot"></span>
      <span class="tb-offline-label">OFFLINE &middot; LOCAL ONLY</span>
    </div>
    <div class="tb-section tb-analyst" id="tb-analyst"></div>
  </div>

  <div id="app-body">
    <div id="rail">
      <nav id="rail-nav" aria-label="Screens"></nav>
      <div id="rail-legend">1-7 SWITCH<br>C CONFIRM<br>X REJECT</div>
    </div>

    <main id="screens-host" style="min-height:0; overflow:hidden;">
      <section id="screen-overview" class="screen"></section>
      <section id="screen-candidate" class="screen"></section>
      <section id="screen-queue" class="screen"></section>
      <section id="screen-search" class="screen"></section>
      <section id="screen-detect" class="screen"></section>
      <section id="screen-discovery" class="screen"></section>
      <section id="screen-watch" class="screen"></section>
    </main>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
