<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSeek</title>
<script>
// Applied before any CSS paints, so the stored theme is correct on the very
// first frame instead of flashing dark then switching to light. Mirrors
// js/theme.js's storage key/attribute; kept as plain inline JS (not a
// module import) specifically so it runs synchronously here.
(function () {
  try {
    if (localStorage.getItem("geoseek-theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
  } catch (e) { /* private mode - defaults to dark */ }
})();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens/candidate.css">
<link rel="stylesheet" href="css/screens/queue.css">
<link rel="stylesheet" href="css/screens/overview.css">
<link rel="stylesheet" href="css/screens/search.css">
<link rel="stylesheet" href="css/screens/detect.css">
<link rel="stylesheet" href="css/screens/discovery.css">
<link rel="stylesheet" href="css/screens/watch.css">
<link rel="stylesheet" href="css/alert-banner.css">
<link rel="stylesheet" href="css/year-tabs.css">
<link rel="stylesheet" href="css/shortcut-help.css">
<link rel="stylesheet" href="css/activity-feed.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/leaflet-theme.css">
</head>
<body>
<div id="intro" role="status" aria-live="polite">
  <div class="intro-scene" id="intro-scene"></div>
  <div class="intro-content">
    <div class="intro-title">GEOSEEK</div>
    <div class="intro-sub">v1.0 &middot; AIR-GAPPED ANALYST WORKSPACE</div>
    <div class="intro-bar"><div class="intro-bar-fill"></div></div>
    <div class="intro-status" id="intro-status"></div>
  </div>
  <div class="intro-skip">CLICK OR PRESS ANY KEY TO SKIP</div>
</div>
<div id="root">
  <div id="topbar">
    <div class="tb-section tb-wordmark" id="tb-wordmark"></div>
    <div class="tb-section tb-aoi" id="tb-aoi"></div>
    <div class="tb-section tb-window" id="tb-window"></div>
    <div class="tb-spacer"></div>
    <div class="tb-section tb-theme" id="tb-theme"></div>
    <div class="tb-section tb-offline" id="tb-offline">
      <span class="tb-offline-dot"></span>
      <span class="tb-offline-label">OFFLINE &middot; LOCAL ONLY</span>
    </div>
    <div class="tb-section tb-analyst" id="tb-analyst"></div>
  </div>

  <div id="app-body">
    <div id="rail">
      <nav id="rail-nav" aria-label="Screens"></nav>
      <div id="rail-legend">1-7 SWITCH<br>C CONFIRM<br>X REJECT<br>? HELP</div>
    </div>

    <main id="screens-host" style="min-height:0; overflow:hidden;">
      <section id="screen-overview" class="screen"></section>
      <section id="screen-candidate" class="screen"></section>
      <section id="screen-queue" class="screen"></section>
      <section id="screen-search" class="screen"></section>
      <section id="screen-detect" class="screen"></section>
      <section id="screen-discovery" class="screen"></section>
      <section id="screen-watch" class="screen"></section>
    </main>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="shortcut-overlay" class="shortcut-overlay hidden" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"></div>

<script type="importmap">
{
  "imports": { "three": "./vendor/three.module.min.js" }
}
</script>
<!-- Leaflet and Chart.js ship as classic UMD globals (L, Chart), not ES
     modules - loaded as plain scripts here, same as any other vendored
     no-build-step dependency, before the app's own module graph. -->
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/chart.umd.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
